<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Chatbot</title>
<style>
:root{--bg:#faf9f6;--surface:#fff;--text:#1f1f1c;--muted:#6b6b64;--accent:#c96442;--on-accent:#fff;--user:#c96442;--bot:#efede7;--border:#e2dfd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b19;--surface:#262624;--text:#ececE6;--muted:#9a9a92;--bot:#2e2e2b;--border:#3a3a36}}
:root[data-theme="dark"]{--bg:#1b1b19;--surface:#262624;--text:#ececE6;--muted:#9a9a92;--bot:#2e2e2b;--border:#3a3a36}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:4px 10px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--user);color:var(--on-accent);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.err{color:#b3261e}
.hint{color:var(--muted);text-align:center;margin:auto;max-width:280px}
form,.bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;max-height:140px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit}
#send{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:0 18px}
#send:disabled{opacity:.5}
#mic{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:0 14px}
#mic.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
header div{display:flex;gap:6px}
</style>
</head>
<body>
<header><h1>My Chatbot</h1><div><button class="ghost" id="speak" type="button" aria-pressed="true">🔊 Voice on</button><button class="ghost" id="clear" type="button">New chat</button></div></header>
<main id="log" aria-live="polite"></main>
<div class="bar">
<textarea id="input" rows="1" placeholder="Message…" aria-label="Message"></textarea>
<button id="mic" type="button" aria-label="Speak">🎤</button>
<button id="send" type="button">Send</button>
</div>
<script>
(function(){
var SYSTEM="You are a friendly, knowledgeable general-purpose assistant in a chat app. Be concise and clear, use plain text (no markdown tables), and ask a short clarifying question when a request is ambiguous.";
var KEY="chat-history-v1";
var log=document.getElementById("log"),input=document.getElementById("input"),send=document.getElementById("send");
var history=[],sample=null,ctrl=null,busy=false;

function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(v))history=v}catch(e){history=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(history.slice(-40)))}catch(e){}}
function add(role,text,cls){var d=document.createElement("div");d.className="msg "+role+(cls?" "+cls:"");d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function render(){log.textContent="";if(!history.length){var h=document.createElement("div");h.className="hint";h.textContent="Ask me anything to get started.";log.appendChild(h);return}
history.forEach(function(m){add(m.role==="user"?"user":"bot",m.content)})}
function payload(){var msgs=history.map(function(m){return{role:m.role,content:m.content}});
msgs[0]={role:"user",content:SYSTEM+"\n\n---\nConversation starts:\n"+msgs[0].content};return msgs}
function setBusy(b){busy=b;send.textContent=b?"Stop":"Send"}

async function submit(){
 if(busy){if(ctrl)ctrl.abort();return}
 var text=input.value.trim();if(!text)return;stopSpeaking();
 if(!sample){sample=await claude.use("sample");if(!sample){add("bot","Chat isn't available in this view.","err");return}}
 input.value="";input.style.height="auto";
 if(!history.length)log.textContent="";
 history.push({role:"user",content:text});add("user",text);
 var out=add("bot","…");setBusy(true);ctrl=new AbortController();
 try{
  var r=await sample(payload(),{cache:false,signal:ctrl.signal,onText:function(t){out.textContent=t.text;log.scrollTop=log.scrollHeight}});
  out.textContent=r.text;history.push({role:"assistant",content:r.text});save();speakText(r.text);
 }catch(e){
  if(e&&e.text){out.textContent=e.text;history.push({role:"assistant",content:e.text});save()}
  else{history.pop();out.className="msg bot err";out.textContent=(e&&e.code==="rate_limited")?"Too many requests. Wait a moment and try again.":(e&&e.code==="not_granted")?"Permission to chat was declined.":"Something went wrong. Please try again."}
 }finally{setBusy(false);ctrl=null}
}
send.addEventListener("click",submit);
input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit()}});
input.addEventListener("input",function(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px"});
document.getElementById("clear").addEventListener("click",function(){stopSpeaking();if(ctrl)ctrl.abort();history=[];save();render()});
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var mic=document.getElementById("mic"),speakBtn=document.getElementById("speak");
var speakOn=true,rec=null,listening=false;
try{speakOn=localStorage.getItem("speak-on")!=="0"}catch(e){}
function paintSpeak(){speakBtn.textContent=speakOn?"🔊 Voice on":"🔇 Voice off";speakBtn.setAttribute("aria-pressed",String(speakOn))}
function stopSpeaking(){if(window.speechSynthesis)speechSynthesis.cancel()}
function speakText(t){
 if(!speakOn||!window.speechSynthesis)return;
 var clean=t.replace(/[*_`#>]/g,"");
 clean.split(/(?<=[.!?])\s+/).forEach(function(s){if(!s.trim())return;var u=new SpeechSynthesisUtterance(s);u.lang=navigator.language||"en-US";speechSynthesis.speak(u)})
}
speakBtn.addEventListener("click",function(){speakOn=!speakOn;try{localStorage.setItem("speak-on",speakOn?"1":"0")}catch(e){}if(!speakOn)stopSpeaking();paintSpeak()});
paintSpeak();
if(!SR){mic.hidden=true}else{
 mic.addEventListener("click",function(){
  if(listening){rec.stop();return}
  if(busy)return;
  stopSpeaking();
  var finalText="";
  rec=new SR();rec.lang=navigator.language||"en-US";rec.interimResults=true;rec.continuous=false;
  rec.onstart=function(){listening=true;mic.classList.add("on");input.placeholder="Listening…"};
  rec.onresult=function(e){var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;input.value=t;finalText=t};
  rec.onerror=function(e){var m=(e.error==="not-allowed"||e.error==="service-not-allowed")?"Microphone access is blocked. Allow it in your browser settings and try again.":(e.error==="no-speech"||e.error==="aborted")?null:"Voice input failed ("+e.error+").";if(m)add("bot",m,"err")};
  rec.onend=function(){listening=false;mic.classList.remove("on");input.placeholder="Message…";if(finalText.trim()&&!busy)submit()};
  try{rec.start()}catch(e){}
 })
}
load();render();
})();
</script>
</body>
</html>
